<!-- SCRIPTS -->
    <script>
        const CSV_BOOKING_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRgLQ8hj-ab5ZOJu31Z1d2gyWxeYNxl4BXHjXYZSq9eaAAnURBkcv61joIaU0Qpj-7G-eQ-yV2uGAIz/pub?gid=0&single=true&output=csv';
        const CSV_SOP_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTIDLFkByyO5KJDw2vLnF2kxcj1lSoDEeN_Hw9fnYOEnmXvuZuzynN1ncnaGsudHALaj-DR0nzMHB0j/pub?gid=0&single=true&output=csv';
        const CSV_DETAIL_PART_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTIDLFkByyO5KJDw2vLnF2kxcj1lSoDEeN_Hw9fnYOEnmXvuZuzynN1ncnaGsudHALaj-DR0nzMHB0j/pub?gid=539769690&single=true&output=csv';

        let rawBookingData = [], filteredBookingData = [];
        let trendChartInstance = null, sumberChartInstance = null, bocPerMraChartInstance = null;
        let rawSopMasterData = [], rawDetailPartData = [], groupedSopData = [], filteredSopData = [], sopCharts = {};

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            fetchAllData();

            ['sop-search', 'sop-filter-sa', 'sop-filter-status', 'sop-filter-start', 'sop-filter-end'].forEach(id => {
                const el = document.getElementById(id);
                if(el) el.addEventListener('input', applySopFilters);
            });
        });

        function switchView(viewName) {
            const bookingView = document.getElementById('view-booking');
            const sopView = document.getElementById('view-sop');
            const navBooking = document.getElementById('nav-booking');
            const navSop = document.getElementById('nav-sop');
            const pageTitle = document.getElementById('page-title');
            const pageSubtitle = document.getElementById('page-subtitle');

            if (viewName === 'booking') {
                bookingView.classList.remove('hidden');
                sopView.classList.add('hidden');
                navBooking.className = "w-full flex items-center gap-3 px-4 py-3 bg-red-50 text-red-600 font-semibold rounded-xl transition-all";
                navSop.className = "w-full flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 font-semibold rounded-xl transition-all";
                pageTitle.textContent = "Astrido Karawang Booking Analytics";
                pageSubtitle.textContent = "Monitoring Kedatangan & Performance Booking MRA";
            } else {
                bookingView.classList.add('hidden');
                sopView.classList.remove('hidden');
                navSop.className = "w-full flex items-center gap-3 px-4 py-3 bg-red-50 text-red-600 font-semibold rounded-xl transition-all";
                navBooking.className = "w-full flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 font-semibold rounded-xl transition-all";
                pageTitle.textContent = "Astrido Karawang Special Order Part";
                pageSubtitle.textContent = "Monitoring Pesanan Suku Cadang Khusus";
            }
            toggleSidebar();
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
            document.getElementById('sidebarOverlay').classList.toggle('hidden');
        }

        function fetchAllData() {
            const refreshIcon = document.getElementById('refreshIcon');
            if(refreshIcon) refreshIcon.classList.add('animate-spin');
            
            Promise.all([
                new Promise(resolve => {
                    Papa.parse(`${CSV_BOOKING_URL}&_t=${Date.now()}`, {
                        download: true, header: true, skipEmptyLines: true,
                        complete: function(results) {
                            rawBookingData = processBookingData(results.data);
                            populateBookingMraFilterOptions();
                            applyBookingFilters();
                            resolve();
                        }
                    });
                }),
                new Promise(resolve => {
                    Papa.parse(`${CSV_SOP_URL}&_t=${Date.now()}`, {
                        download: true, header: false, skipEmptyLines: true,
                        complete: function(results) {
                            rawSopMasterData = results.data;
                            resolve();
                        }
                    });
                }),
                new Promise(resolve => {
                    Papa.parse(`${CSV_DETAIL_PART_URL}&_t=${Date.now()}`, {
                        download: true, header: false, skipEmptyLines: true,
                        complete: function(results) {
                            rawDetailPartData = results.data;
                            resolve();
                        }
                    });
                })
            ]).then(() => {
                groupedSopData = groupSopByCodeMatrix(rawSopMasterData, rawDetailPartData);
                populateSopSAFilter();
                applySopFilters();

                if(refreshIcon) refreshIcon.classList.remove('animate-spin');
                const el = document.getElementById('last-sync-tag');
                if(el) el.innerText = `Sync: ${new Date().toLocaleTimeString()}`;
            }).catch(() => {
                if(refreshIcon) refreshIcon.classList.remove('animate-spin');
            });
        }

        // ================= BOOKING LOGIC =================
        function getVal(row, keys) {
            if (!row) return '';
            const rowKeys = Object.keys(row);
            for (let key of keys) {
                // Perbaikan pencarian key agar lebih fleksibel terhadap spasi dan case-insensitive
                const found = rowKeys.find(k => k.trim().toLowerCase().replace(/\s+/g, '') === key.toLowerCase().replace(/\s+/g, ''));
                if (found && row[found] !== undefined && row[found] !== null) {
                    return String(row[found]).trim();
                }
            }
            return '';
        }

        function parseDate(dateStr) {
            if (!dateStr || dateStr === '-' || dateStr === 'N/A') return null;
            let cleaned = String(dateStr).trim().replace(/\s+/g, ' ');
            const parts = cleaned.split(/[-/\s]+/);
            if (parts.length >= 3) {
                const day = parseInt(parts[0], 10);
                const monthStr = parts[1].toLowerCase();
                let year = parseInt(parts[2], 10);
                if (year < 100) year += 2000;
                const months = { jan: 0, feb: 1, mar: 2, apr: 3, mei: 4, may: 4, jun: 5, jul: 6, agu: 7, aug: 7, sep: 8, okt: 9, oct: 9, nov: 10, des: 11, dec: 11 };
                if (months[monthStr] !== undefined && !isNaN(day) && !isNaN(year)) {
                    return new Date(year, months[monthStr], day);
                }
            }
            const d = new Date(cleaned);
            return isNaN(d.getTime()) ? null : d;
        }

        function processBookingData(data) {
            return data.map(row => {
                const nopol = getVal(row, ['Nomor Polisi', 'No Polisi', 'No Pol', 'Nopol']) || '-';
                const sumber = getVal(row, ['Sumber Data', 'Sumber', 'Media']) || 'Lainnya';
                const tglService = getVal(row, ['Service Tanggal', 'Tgl Service', 'Tanggal Service', 'Tanggal']) || '-';
                const tglBoc = getVal(row, ['Tanggal BOC', 'Tgl BOC', 'BOC']) || '';
                
                // Diperluas variasi pencarian kolom MRA untuk mencegah Unassigned massal
                const mraVal = getVal(row, ['Nama MRA', 'MRA', 'Nama Mra', 'Nama Sales MRA', 'Sales MRA']);
                const mra = (mraVal !== '' && mraVal !== '-') ? mraVal : 'Unassigned';
                
                const caiVal = getVal(row, ['CAI', 'Status Kedatangan', 'Status']).toUpperCase();

                let status = 'BELUM DATANG';
                if (caiVal.includes('BELUM')) status = 'BELUM DATANG';
                else if (caiVal.includes('TIDAK') || caiVal.includes('CANCEL') || caiVal.includes('BATAL')) status = 'TIDAK DATANG';
                else if (caiVal.includes('DATANG') || caiVal.includes('DATAN') || caiVal === 'SBE' || caiVal === 'GRP') status = 'DATANG';

                return { nopol, sumber, tglService, tglBoc, mra, status };
            });
        }

        function populateBookingMraFilterOptions() {
            const filterMra = document.getElementById('filterMra');
            const currentSelected = filterMra.value;
            const mraList = [...new Set(rawBookingData.map(item => item.mra))].filter(m => m !== 'Unassigned' && m !== '-' && m !== '').sort();
            filterMra.innerHTML = '<option value="ALL">Semua MRA</option>';
            mraList.forEach(mra => {
                const opt = document.createElement('option');
                opt.value = mra; opt.textContent = mra;
                filterMra.appendChild(opt);
            });
            if (mraList.includes(currentSelected)) filterMra.value = currentSelected;
        }

        function applyBookingFilters() {
            updateBookingKPIs();
            renderTrendChart();
            renderSumberDataChart();
            renderBocPerMraChart();
            renderMraLeaderboard();
        }

        function updateBookingKPIs() {
            const startDateVal = document.getElementById('startDate').value;
            const endDateVal = document.getElementById('endDate').value;
            const selectedMra = document.getElementById('filterMra').value;

            const startLimit = startDateVal ? new Date(startDateVal + 'T00:00:00') : null;
            const endLimit = endDateVal ? new Date(endDateVal + 'T23:59:59') : null;

            const filteredGeneral = rawBookingData.filter(item => {
                if (selectedMra !== 'ALL' && item.mra !== selectedMra) return false;
                if (startLimit || endLimit) {
                    const itemDate = parseDate(item.tglService);
                    if (itemDate) {
                        if (startLimit && itemDate < startLimit) return false;
                        if (endLimit && itemDate > endLimit) return false;
                    }
                }
                return true;
            });

            filteredBookingData = filteredGeneral;

            const totalBooking = filteredGeneral.length;
            const totalDatang = filteredGeneral.filter(d => d.status === 'DATANG').length;
            const tidakDatang = filteredGeneral.filter(d => d.status === 'TIDAK DATANG').length;
            const belumDatang = filteredGeneral.filter(d => d.status === 'BELUM DATANG').length;
            
            const showRate = totalBooking > 0 ? ((totalDatang / totalBooking) * 100).toFixed(1) : 0;
            const pctDatang = totalBooking > 0 ? ((totalDatang / totalBooking) * 100).toFixed(1) : 0;
            const pctTidakDatang = totalBooking > 0 ? ((tidakDatang / totalBooking) * 100).toFixed(1) : 0;
            const pctBelumDatang = totalBooking > 0 ? ((belumDatang / totalBooking) * 100).toFixed(1) : 0;
            
            const bookingOnCallCount = rawBookingData.filter(item => {
                if (selectedMra !== 'ALL' && item.mra !== selectedMra) return false;
                const bocStr = String(item.tglBoc || '').trim();
                const isValidBoc = bocStr !== '' && bocStr !== '-' && bocStr.toLowerCase() !== 'undefined' && bocStr.toLowerCase() !== 'null';
                if (!isValidBoc) return false;

                if (startLimit || endLimit) {
                    const bocDate = parseDate(item.tglBoc);
                    if (bocDate) {
                        if (startLimit && bocDate < startLimit) return false;
                        if (endLimit && bocDate > endLimit) return false;
                    } else {
                        return false;
                    }
                }
                return true;
            }).length;

            const pctTotalBookingVsBoc = bookingOnCallCount > 0 ? ((totalBooking / bookingOnCallCount) * 100).toFixed(1) : 0;

            document.getElementById('kpiBookingOnCall').textContent = bookingOnCallCount.toLocaleString('id-ID');
            document.getElementById('kpiTotalBooking').textContent = totalBooking.toLocaleString('id-ID');
            document.getElementById('pctTotalBookingVsBoc').textContent = `${pctTotalBookingVsBoc}% dari BOC`;
            document.getElementById('kpiTotalDatang').textContent = totalDatang.toLocaleString('id-ID');
            document.getElementById('pctDatangVsBooking').textContent = `${pctDatang}% dari Total Booking`;
            document.getElementById('kpiTidakDatang').textContent = tidakDatang.toLocaleString('id-ID');
            document.getElementById('pctTidakDatangVsBooking').textContent = `${pctTidakDatang}% dari Total Booking`;
            document.getElementById('kpiBelumDatang').textContent = belumDatang.toLocaleString('id-ID');
            document.getElementById('pctBelumDatangVsBooking').textContent = `${pctBelumDatang}% dari Total Booking`;
            document.getElementById('kpiShowRate').textContent = `${showRate}%`;
        }

        function renderTrendChart() {
            const granularity = document.getElementById('trendGranularity')?.value || 'daily';
            const monthsShort = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
            const groupMap = {};

            filteredBookingData.forEach(item => {
                const pDate = parseDate(item.tglService);
                if (!pDate) return;

                let groupKey = '', displayLabel = '';
                if (granularity === 'monthly') {
                    groupKey = `${pDate.getFullYear()}-${String(pDate.getMonth() + 1).padStart(2, '0')}`;
                    displayLabel = `${monthsShort[pDate.getMonth()]} ${pDate.getFullYear()}`;
                } else if (granularity === 'weekly') {
                    const d = new Date(pDate.getTime());
                    const day = d.getDay();
                    const diff = d.getDate() - day + (day === 0 ? -6 : 1);
                    const monday = new Date(d.setDate(diff));
                    groupKey = `${monday.getFullYear()}-${String(monday.getMonth() + 1).padStart(2, '0')}-${String(monday.getDate()).padStart(2, '0')}`;
                    displayLabel = `Minggu (${String(monday.getDate()).padStart(2, '0')} ${monthsShort[monday.getMonth()]})`;
                } else {
                    groupKey = `${pDate.getFullYear()}-${String(pDate.getMonth() + 1).padStart(2, '0')}-${String(pDate.getDate()).padStart(2, '0')}`;
                    displayLabel = `${String(pDate.getDate()).padStart(2, '0')} ${monthsShort[pDate.getMonth()]}`;
                }

                if (!groupMap[groupKey]) {
                    groupMap[groupKey] = { label: displayLabel, DATANG: 0, 'TIDAK DATANG': 0, 'BELUM DATANG': 0 };
                }
                if (groupMap[groupKey][item.status] !== undefined) groupMap[groupKey][item.status]++;
            });

            const sortedKeys = Object.keys(groupMap).sort();
            const labels = sortedKeys.map(k => groupMap[k].label);
            const datangData = sortedKeys.map(k => groupMap[k].DATANG);
            const tidakDatangData = sortedKeys.map(k => groupMap[k]['TIDAK DATANG']);
            const belumDatangData = sortedKeys.map(k => groupMap[k]['BELUM DATANG']);

            if (trendChartInstance) trendChartInstance.destroy();

            const ctx = document.getElementById('trendChart').getContext('2d');
            trendChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [
                        { label: 'Datang', data: datangData, borderColor: '#10b981', backgroundColor: '#10b98120', tension: 0.3, fill: true },
                        { label: 'Tidak Datang', data: tidakDatangData, borderColor: '#ef4444', backgroundColor: '#ef444420', tension: 0.3, fill: true },
                        { label: 'Belum Datang', data: belumDatangData, borderColor: '#f59e0b', backgroundColor: '#f59e0b20', tension: 0.3, fill: true }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { position: 'top', labels: { boxWidth: 12, font: { size: 11 } } } },
                    scales: { x: { grid: { display: false } }, y: { beginAtZero: true, ticks: { precision: 0 } } }
                }
            });
        }

        function renderSumberDataChart() {
            const counts = {};
            filteredBookingData.forEach(item => { counts[item.sumber] = (counts[item.sumber] || 0) + 1; });
            const sortedKeys = Object.keys(counts).sort((a,b) => counts[b] - counts[a]).slice(0, 7);
            const dataVals = sortedKeys.map(k => counts[k]);

            if (sumberChartInstance) sumberChartInstance.destroy();

            const ctx = document.getElementById('sumberDataChart').getContext('2d');
            sumberChartInstance = new Chart(ctx, {
                type: 'bar',
                data: { labels: sortedKeys, datasets: [{ label: 'Total Booking', data: dataVals, backgroundColor: '#3b82f6', borderRadius: 6 }] },
                options: {
                    indexAxis: 'y', responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { x: { beginAtZero: true, ticks: { precision: 0 } }, y: { grid: { display: false } } }
                }
            });
        }

        function renderBocPerMraChart() {
            const startDateVal = document.getElementById('startDate').value;
            const endDateVal = document.getElementById('endDate').value;
            const selectedMra = document.getElementById('filterMra').value;
            const startLimit = startDateVal ? new Date(startDateVal + 'T00:00:00') : null;
            const endLimit = endDateVal ? new Date(endDateVal + 'T23:59:59') : null;

            const bocTotalMap = {};
            const bocDatangMap = {};

            rawBookingData.forEach(item => {
                if (selectedMra !== 'ALL' && item.mra !== selectedMra) return;
                const bocStr = String(item.tglBoc || '').trim();
                const isValidBoc = bocStr !== '' && bocStr !== '-' && bocStr.toLowerCase() !== 'undefined' && bocStr.toLowerCase() !== 'null';
                if (!isValidBoc) return;

                if (startLimit || endLimit) {
                    const bocDate = parseDate(item.tglBoc);
                    if (bocDate) {
                        if (startLimit && bocDate < startLimit) return;
                        if (endLimit && bocDate > endLimit) return;
                    } else {
                        return;
                    }
                }

                const mraName = item.mra;
                if (mraName && mraName !== '-' && mraName !== 'Unassigned') {
                    bocTotalMap[mraName] = (bocTotalMap[mraName] || 0) + 1;
                    if (item.status === 'DATANG') {
                        bocDatangMap[mraName] = (bocDatangMap[mraName] || 0) + 1;
                    }
                }
            });

            const sortedMras = Object.keys(bocTotalMap).sort((a,b) => bocTotalMap[b] - bocTotalMap[a]);
            const totalBocData = sortedMras.map(m => bocTotalMap[m] || 0);
            const datangBocData = sortedMras.map(m => bocDatangMap[m] || 0);

            if (bocPerMraChartInstance) bocPerMraChartInstance.destroy();

            const ctx = document.getElementById('bocPerMraChart').getContext('2d');
            bocPerMraChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: sortedMras,
                    datasets: [
                        { label: 'Total Booking On Call (BOC)', data: totalBocData, backgroundColor: '#334155', borderRadius: 6 },
                        { label: 'BOC Sudah Datang', data: datangBocData, backgroundColor: '#10b981', borderRadius: 6 }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { position: 'top', labels: { boxWidth: 12, font: { size: 11 } } } },
                    scales: { x: { grid: { display: false } }, y: { beginAtZero: true, ticks: { precision: 0 } } }
                }
            });
        }

        function renderMraLeaderboard() {
            const mraStats = {};
            filteredBookingData.forEach(item => {
                const name = item.mra;
                if (!mraStats[name]) mraStats[name] = { total: 0, datang: 0, tidak: 0, belum: 0 };
                mraStats[name].total++;
                if (item.status === 'DATANG') mraStats[name].datang++;
                else if (item.status === 'TIDAK DATANG') mraStats[name].tidak++;
                else mraStats[name].belum++;
            });

            const sortedMra = Object.keys(mraStats).map(name => {
                const total = mraStats[name].total;
                const datang = mraStats[name].datang;
                const showRate = total > 0 ? ((datang / total) * 100).toFixed(1) : 0;
                return { name, ...mraStats[name], showRate: parseFloat(showRate) };
            }).sort((a,b) => b.showRate - a.showRate || b.total - a.total);

            const tbody = document.getElementById('mraTableBody');
            tbody.innerHTML = '';

            if (sortedMra.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="py-6 text-center text-slate-400">Tidak ada data ditemukan</td></tr>`;
                return;
            }

            sortedMra.forEach((mra, index) => {
                let badgeClass = 'bg-red-50 text-red-600 border-red-200';
                if (mra.showRate > 60) badgeClass = 'bg-emerald-50 text-emerald-600 border-emerald-200';
                else if (mra.showRate >= 40) badgeClass = 'bg-amber-50 text-amber-600 border-amber-200';

                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition-colors";
                tr.innerHTML = `
                    <td class="py-3 px-4 text-center">
                        <span class="inline-flex items-center justify-center w-6 h-6 rounded-full text-xs font-bold ${index === 0 ? 'bg-amber-100 text-amber-700' : index === 1 ? 'bg-slate-200 text-slate-700' : index === 2 ? 'bg-amber-800/10 text-amber-800' : 'text-slate-500'}">${index + 1}</span>
                    </td>
                    <td class="py-3 px-4 font-bold text-slate-800">${mra.name}</td>
                    <td class="py-3 px-4 text-center font-bold text-blue-600 hover:underline cursor-pointer" onclick="openMraModal('${mra.name}', 'ALL')">${mra.total}</td>
                    <td class="py-3 px-4 text-center text-emerald-600 font-bold hover:underline cursor-pointer" onclick="openMraModal('${mra.name}', 'DATANG')">${mra.datang}</td>
                    <td class="py-3 px-4 text-center text-rose-600 font-bold hover:underline cursor-pointer" onclick="openMraModal('${mra.name}', 'TIDAK DATANG')">${mra.tidak}</td>
                    <td class="py-3 px-4 text-center text-amber-600 font-bold hover:underline cursor-pointer" onclick="openMraModal('${mra.name}', 'BELUM DATANG')">${mra.belum}</td>
                    <td class="py-3 px-4 text-center"><span class="px-2.5 py-1 rounded-full text-xs font-bold border ${badgeClass}">${mra.showRate}%</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function openMraModal(mraName, statusType) {
            let list = filteredBookingData.filter(d => d.mra === mraName);
            if (statusType !== 'ALL') list = list.filter(d => d.status === statusType);
            openBookingModalCustom(`Detail MRA: ${mraName} (${statusType})`, `Menampilkan rincian nopol unit untuk MRA ${mraName}`, list);
        }

        function openBookingModal(type) {
            if (type === 'BOOKING ON CALL') {
                const startDateVal = document.getElementById('startDate').value;
                const endDateVal = document.getElementById('endDate').value;
                const selectedMra = document.getElementById('filterMra').value;
                const startLimit = startDateVal ? new Date(startDateVal + 'T00:00:00') : null;
                const endLimit = endDateVal ? new Date(endDateVal + 'T23:59:59') : null;

                const listBoc = rawBookingData.filter(item => {
                    if (selectedMra !== 'ALL' && item.mra !== selectedMra) return false;
                    const bocStr = String(item.tglBoc || '').trim();
                    const isValidBoc = bocStr !== '' && bocStr !== '-' && bocStr.toLowerCase() !== 'undefined' && bocStr.toLowerCase() !== 'null';
                    if (!isValidBoc) return false;

                    if (startLimit || endLimit) {
                        const bocDate = parseDate(item.tglBoc);
                        if (bocDate) {
                            if (startLimit && bocDate < startLimit) return false;
                            if (endLimit && bocDate > endLimit) return false;
                        } else {
                            return false;
                        }
                    }
                    return true;
                });

                document.getElementById('bookingModalTitle').textContent = 'Detail KPI: BOOKING ON CALL (BOC)';
                document.getElementById('bookingModalSubtitle').textContent = 'Daftar transaksi berdasarkan Tanggal BOC & Rentang Filter';
                const thead = document.getElementById('bookingModalTableHeader');
                const tbody = document.getElementById('bookingModalTableBody');
                thead.innerHTML = `<tr><th class="py-3 px-4 text-left">Nomor Polisi</th><th class="py-3 px-4 text-left">Tanggal BOC</th><th class="py-3 px-4 text-left">Tanggal Service</th><th class="py-3 px-4 text-left">Status Kedatangan</th><th class="py-3 px-4 text-left">MRA</th><th class="py-3 px-4 text-left">Sumber Data</th></tr>`;
                tbody.innerHTML = '';
                if (listBoc.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="py-6 text-center text-slate-400">Tidak ada data unit ditemukan.</td></tr>`;
                } else {
                    listBoc.forEach(item => {
                        let badgeColor = 'bg-amber-50 text-amber-600 border-amber-200';
                        if (item.status === 'DATANG') badgeColor = 'bg-emerald-50 text-emerald-600 border-emerald-200';
                        else if (item.status === 'TIDAK DATANG') badgeColor = 'bg-rose-50 text-rose-600 border-rose-200';
                        const tr = document.createElement('tr');
                        tr.className = "hover:bg-slate-50 transition-colors";
                        tr.innerHTML = `<td class="py-2.5 px-4 font-bold text-slate-900">${item.nopol}</td><td class="py-2.5 px-4 font-semibold text-purple-600">${item.tglBoc}</td><td class="py-2.5 px-4 text-slate-600 font-medium">${item.tglService}</td><td class="py-2.5 px-4"><span class="px-2 py-0.5 rounded text-[10px] font-bold border ${badgeColor}">${item.status}</span></td><td class="py-2.5 px-4 font-medium text-slate-700">${item.mra}</td><td class="py-2.5 px-4 text-slate-500">${item.sumber}</td>`;
                        tbody.appendChild(tr);
                    });
                }
                document.getElementById('bookingModalRecordCount').textContent = `Total: ${listBoc.length} Record`;
                document.getElementById('bookingModal').classList.remove('hidden');
                return;
            }

            let list = filteredBookingData;
            if (type === 'TOTAL DATANG') list = filteredBookingData.filter(d => d.status === 'DATANG');
            else if (type === 'TIDAK DATANG') list = filteredBookingData.filter(d => d.status === 'TIDAK DATANG');
            else if (type === 'BELUM DATANG') list = filteredBookingData.filter(d => d.status === 'BELUM DATANG');

            openBookingModalCustom(`Detail KPI: ${type}`, `Menampilkan daftar rincian kendaraan (${type})`, list);
        }

                    tbody.appendChild(tr);
                });

            document.getElementById('bookingModalRecordCount').textContent = `Total: ${list.length} Record`;

        }

        function closeBookingModal() { document.getElementById('bookingModal').classList.add('hidden'); }


        // ================= SPECIAL ORDER PART (SOP) LOGIC =================
        function groupSopByCodeMatrix(masterRows, detailRows) {
            const detailMap = {};
            
            if (detailRows && detailRows.length > 0) {
                for (let i = 0; i < detailRows.length; i++) {
                    const r = detailRows[i];
                    if (!r || !r[0]) continue;
                    const code = String(r[0]).trim();
                    if (!code || code.toLowerCase() === 'code') continue;
                    
                    if (!detailMap[code]) detailMap[code] = [];
                    detailMap[code].push({
                        'No Part': String(r[1] || '').trim(),
                        'Qty': String(r[2] || '1').trim(),
                        'Nama Part': String(r[3] || '').trim()
                    });
                }
            }

            const map = {};
            if (masterRows && masterRows.length > 1) {
                for (let i = 1; i < masterRows.length; i++) {
                    const r = masterRows[i];
                    if (!r || !r[0]) continue;
                    const code = String(r[0]).trim();
                    if (!code) continue;

                    let items = detailMap[code];
                    if (!items || items.length === 0) {
                        items = [{
                            'No Part': '-',
                            'Qty': '1',
                            'Nama Part': '-'
                        }];
                    }

                    if (!map[code]) {
                        map[code] = {
                            Code: code,
                            'Nama SA': String(r[1] || '').trim(),
                            'No Kendaraan': String(r[2] || '').trim(),
                            'Tanggal Order': String(r[3] || '').trim(),
                            'Tipe Order': String(r[4] || '').trim(),
                            'ETA B/O': String(r[5] || '').trim(),
                            'Aktual Kedatangan': String(r[6] || '').trim(),
                            'Tanggal Pasang': String(r[7] || '').trim(),
                            'Status Part': String(r[8] || '').trim(),
                            items: items
                        };
                    }
                }
            }
            return Object.values(map);
        }

        function populateSopSAFilter() {
            const select = document.getElementById('sop-filter-sa');
            if(!select) return;
            const current = select.value;
            const saList = [...new Set(groupedSopData.map(i => i['Nama SA']).filter(Boolean))].sort();
            select.innerHTML = '<option value="">Semua SA</option>';
            saList.forEach(sa => {
                const opt = document.createElement('option');
                opt.value = sa; opt.textContent = sa;
                if(sa === current) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function parseSopDateString(str) {
            if (!str) return null;
            let cleaned = String(str).trim().replace(/\s+/g, ' ');
            const parts = cleaned.split(/[-/\s]+/);
            if (parts.length >= 3) {
                const day = parseInt(parts[0], 10);
                const monthStr = parts[1].toLowerCase();
                let year = parseInt(parts[2], 10);
                if (year < 100) year += 2000;
                const months = { jan: 0, feb: 1, mar: 2, apr: 3, mei: 4, may: 4, jun: 5, jul: 6, agu: 7, aug: 7, sep: 8, okt: 9, oct: 9, nov: 10, des: 11, dec: 11 };
                if (months[monthStr] !== undefined && !isNaN(day) && !isNaN(year)) {
                    return new Date(year, months[monthStr], day);
                }
            }
            const d = new Date(cleaned);
            return isNaN(d.getTime()) ? null : d;
        }

        function applySopFilters() {
            const search = document.getElementById('sop-search')?.value.toLowerCase() || '';
            const sa = document.getElementById('sop-filter-sa')?.value || '';
            const status = document.getElementById('sop-filter-status')?.value || '';
            const start = document.getElementById('sop-filter-start')?.value || '';
            const end = document.getElementById('sop-filter-end')?.value || '';

            filteredSopData = groupedSopData.filter(i => {
                const codeMatch = String(i['Code'] || '').toLowerCase().includes(search);
                const vehicleMatch = String(i['No Kendaraan'] || '').toLowerCase().includes(search);
                const partMatch = i.items.some(it => 
                    String(it['No Part']).toLowerCase().includes(search) || 
                    String(it['Nama Part']).toLowerCase().includes(search)
                );
                const matchesSearch = !search || codeMatch || vehicleMatch || partMatch;

                const matchesSA = !sa || i['Nama SA'] === sa;
                
                let matchesStatus = true;
                if (status) {
                    const itemStatus = i['Status Part'].toUpperCase();
                    const filterStatusUpper = status.toUpperCase();
                    if (filterStatusUpper.includes('TUNGGU PASANG')) {
                        matchesStatus = itemStatus.includes('TUNGGU') || itemStatus.includes('PASANG');
                    } else {
                        matchesStatus = itemStatus.includes(filterStatusUpper);
                    }
                }
                
                let matchesDate = true;
                if (start || end) {
                    const d = parseSopDateString(i['Tanggal Order']);
                    if (d) {
                        if (start && d < new Date(start)) matchesDate = false;
                        if (end) { 
                            const ed = new Date(end); 
                            ed.setHours(23,59,59); 
                            if (d > ed) matchesDate = false; 
                        }
                    } else {
                        matchesDate = false;
                    }
                }
                return matchesSearch && matchesSA && matchesStatus && matchesDate;
            });

            filteredSopData.sort((a,b) => (parseSopDateString(b['Tanggal Order']) || 0) - (parseSopDateString(a['Tanggal Order']) || 0));
            updateSopUI();
        }

        function updateSopUI() {
            renderSopKPIs(); 
            renderSopTable(); 
            renderSopCharts();
            const countEl = document.getElementById('sop-data-count');
            if(countEl) countEl.innerText = `${filteredSopData.length} Records (Grouped)`;
        }

        function renderSopKPIs() {
            const getLen = (st) => {
                const upperSt = st.toUpperCase();
                return filteredSopData.filter(i => {
                    const itemStatus = i['Status Part'].toUpperCase();
                    if (upperSt.includes('TUNGGU PASANG')) {
                        return itemStatus.includes('TUNGGU') || itemStatus.includes('PASANG');
                    }
                    return itemStatus.includes(upperSt);
                }).length;
            };

            const counts = { 
                total: filteredSopData.length, 
                sedang: getLen('SEDANG ORDER'),
                bo: getLen('B/O'), 
                pasang: getLen('TUNGGU PASANG'), 
                konf: getLen('Konfirmasi Jadwal'), 
                terpasang: getLen('Terpasang') 
            };
            
            if(document.getElementById('sop-kpi-total')) document.getElementById('sop-kpi-total').innerText = counts.total;
            if(document.getElementById('sop-kpi-sedang')) document.getElementById('sop-kpi-sedang').innerText = counts.sedang;
            if(document.getElementById('sop-kpi-bo')) document.getElementById('sop-kpi-bo').innerText = counts.bo;
            if(document.getElementById('sop-kpi-pasang')) document.getElementById('sop-kpi-pasang').innerText = counts.pasang;
            if(document.getElementById('sop-kpi-konfirmasi')) document.getElementById('sop-kpi-konfirmasi').innerText = counts.konf;
            if(document.getElementById('sop-kpi-terpasang')) document.getElementById('sop-kpi-terpasang').innerText = counts.terpasang;
        }

        function getSopStatusColor(st) {
            if(!st) return 'bg-slate-100 text-slate-500 border-slate-200';
            const statusUpper = st.toUpperCase();
            if (statusUpper.includes('SEDANG ORDER')) return 'bg-purple-50 text-purple-600 border-purple-200';
            if (statusUpper.includes('B/O')) return 'bg-red-50 text-red-600 border-red-200';
            if (statusUpper.includes('KONFIRMASI JADWAL')) return 'bg-amber-50 text-amber-600 border-amber-200';
            if (statusUpper.includes('TUNGGU') || statusUpper.includes('PASANG')) return 'bg-blue-50 text-blue-600 border-blue-200';
            if (statusUpper.includes('TERPASANG')) return 'bg-emerald-50 text-emerald-600 border-emerald-200';
            return 'bg-slate-100 text-slate-500 border-slate-200';
        }

        function renderSopTable() {
            const tbody = document.getElementById('sop-table-body');
            if(!tbody) return;
            
            tbody.innerHTML = filteredSopData.map((i, idx) => {
                return `
                    <tr class="hover:bg-slate-50 transition-colors cursor-pointer" onclick="showSopDetail(${idx})">
                        <td class="px-4 py-4 font-mono text-slate-700 text-[11px] font-bold">${i['Code'] || '-'}</td>
                        <td class="px-4 py-4 font-bold text-slate-800">${i['Nama SA'] || '-'}</td>
                        <td class="px-4 py-4 font-bold text-indigo-600">${i['No Kendaraan'] || '-'}</td>
                        <td class="px-4 py-4 text-slate-500 font-medium">${i['Tanggal Order'] || '-'}</td>
                        <td class="px-4 py-4"><span class="px-2.5 py-1 rounded-full text-[10px] font-bold border ${getSopStatusColor(i['Status Part'])}">${i['Status Part'] || '-'}</span></td>
                        <td class="px-4 py-4 text-center text-slate-400 hover:text-indigo-600"><i data-lucide="eye" class="w-4 h-4 mx-auto"></i></td>
                    </tr>`;
            }).join('');
            lucide.createIcons();
        }

        function renderSopCharts() {
            Object.values(sopCharts).forEach(c => c.destroy());
            
            const partMap = {};
            filteredSopData.forEach(i => { 
                i.items.forEach(it => {
                    const p = (it['No Part'] || '').trim(); 
                    const q = parseInt(it['Qty']) || 1;
                    if(p && p !== '-') partMap[p] = (partMap[p] || 0) + q; 
                });
            });
            const top = Object.entries(partMap).sort((a,b)=>b[1]-a[1]).slice(0,10);

            const ctxTop = document.getElementById('sopTopPartChart');
            if(ctxTop) {
                sopCharts.top = new Chart(ctxTop.getContext('2d'), {
                    type: 'bar',
                    data: { labels: top.map(x=>x[0]), datasets: [{ data: top.map(x=>x[1]), backgroundColor: '#6366f1', borderRadius: 6 }] },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
                });
            }

            let tiba = 0, boTot = 0, boTiba = 0, boPend = 0;
            filteredSopData.forEach(i => {
                const etaVal = String(i['ETA B/O'] || '').trim();
                const actVal = String(i['Aktual Kedatangan'] || '').trim();
                const statusVal = String(i['Status Part'] || '').toUpperCase();

                const isTiba = actVal !== '' && actVal !== '-' || statusVal.includes('TERPASANG') || statusVal.includes('TUNGGU') || statusVal.includes('PASANG');
                const isBo = etaVal !== '' && etaVal !== '-' || statusVal.includes('B/O');

                if (isTiba) tiba++;
                if (isBo) {
                    boTot++;
                    if (isTiba) {
                        boTiba++;
                    } else {
                        boPend++;
                    }
                }
            });
            
            if(document.getElementById('sop-stat-total')) document.getElementById('sop-stat-total').innerText = filteredSopData.length;
            if(document.getElementById('sop-stat-suplai')) document.getElementById('sop-stat-suplai').innerText = tiba;
            if(document.getElementById('sop-stat-total-bo')) document.getElementById('sop-stat-total-bo').innerText = boTot;
            if(document.getElementById('sop-stat-bo-suplai')) document.getElementById('sop-stat-bo-suplai').innerText = boTiba;

            const ctxRatio = document.getElementById('sopSupplyRatioChart');
            if(ctxRatio) {
                sopCharts.ratio = new Chart(ctxRatio.getContext('2d'), {
                    type: 'doughnut',
                    data: { labels: ['BO Tiba', 'BO Pending', 'Direct'], datasets: [{ data: [boTiba, boPend, Math.max(0, tiba-boTiba)], backgroundColor: ['#6366f1', '#ef4444', '#10b981'], borderWeight: 0 }] },
                    options: { responsive: true, maintainAspectRatio: false, cutout: '75%', plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 9 } } } } }
                });
            }

            let ltTot=0, ltCnt=0, ltMax=0; const ltD=[], ltL=[];
            filteredSopData.forEach(i => {
                const o = parseSopDateString(i['Tanggal Order']), a = parseSopDateString(i['Aktual Kedatangan']);
                if(o && a) {
                    const diffTime = a - o;
                    if (diffTime >= 0) {
                        const d = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                        ltTot += d; ltCnt++; 
                        if(d > ltMax) ltMax = d;
                        ltD.push(d); ltL.push(i['Code'] || 'N/A');
                    }
                }
            });
            
            if(document.getElementById('sop-avg-lt')) document.getElementById('sop-avg-lt').innerText = ltCnt ? (ltTot/ltCnt).toFixed(1)+'d' : '0d';
            if(document.getElementById('sop-max-lt')) document.getElementById('sop-max-lt').innerText = ltMax+'d';
            
            const ctxLt = document.getElementById('sopLeadTimeChart');
            if(ctxLt) {
                sopCharts.lt = new Chart(ctxLt.getContext('2d'), {
                    type: 'bar',
                    data: { labels: ltL.slice(0,15), datasets: [{ data: ltD.slice(0,15), backgroundColor: '#ef4444', borderRadius: 4 }] },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
                });
            }
        }

        function showSopDetail(idx) {
            const i = filteredSopData[idx];
            const partsListHtml = i.items.map(it => `
                <div class="bg-white p-2.5 rounded-xl border border-slate-200 mb-2 shadow-sm">
                    <p class="text-slate-800 font-semibold text-xs mt-0.5 truncate-part" title="${it['No Part'] || '-'} - ${it['Nama Part'] || '-'}"><strong class="font-mono text-indigo-600">${it['No Part'] || '-'}</strong> - ${it['Nama Part'] || '-'}</p>
                    <p class="text-[10px] text-slate-500 mt-1 font-bold">Qty: <span class="text-indigo-600">${it['Qty'] || '1'}</span></p>
                </div>
            `).join('');

            document.getElementById('sopModalContent').innerHTML = `
                <div class="grid grid-cols-2 gap-4 text-xs">
                    <div class="col-span-2 bg-slate-50 p-4 rounded-2xl border border-slate-100 text-center">
                        <p class="text-[9px] font-bold text-slate-400 uppercase mb-1">Code Order</p>
                        <p class="font-mono text-indigo-600 font-bold text-sm">${i['Code'] || '-'}</p>
                    </div>
                    <div class="col-span-2 bg-slate-100/70 p-3 rounded-2xl max-h-52 overflow-y-auto">
                        <p class="text-[9px] font-bold text-slate-400 uppercase mb-2">Daftar Suku Cadang (No Part - Nama Part - Qty)</p>
                        <div class="space-y-1">${partsListHtml}</div>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-2xl">
                        <p class="text-[9px] font-bold text-slate-400 uppercase mb-1">Service Advisor</p>
                        <p class="font-bold text-slate-800">${i['Nama SA'] || '-'}</p>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-2xl">
                        <p class="text-[9px] font-bold text-slate-400 uppercase mb-1">No Polisi</p>
                        <p class="font-bold text-indigo-600 uppercase">${i['No Kendaraan'] || '-'}</p>
                    </div>
                    <div class="space-y-3">
                        <div><p class="text-[9px] font-bold text-slate-400 uppercase">Tgl Order</p><p class="font-semibold text-slate-700">${i['Tanggal Order'] || '-'}</p></div>
                        <div><p class="text-[9px] font-bold text-slate-400 uppercase">Tgl Pasang</p><p class="font-semibold text-slate-700">${i['Tanggal Pasang'] || '-'}</p></div>
                    </div>
                    <div class="space-y-3">
                        <div><p class="text-[9px] font-bold text-slate-400 uppercase">ETA B/O</p><p class="font-bold text-red-500">${i['ETA B/O'] || '-'}</p></div>
                        <div><p class="text-[9px] font-bold text-slate-400 uppercase">Status</p><span class="px-2 py-0.5 rounded text-[9px] font-bold border ${getSopStatusColor(i['Status Part'])}">${i['Status Part'] || '-'}</span></div>
                    </div>
                </div>`;
            document.getElementById('sopDetailModal').classList.remove('hidden');
        }

        function closeSopDetailModal() { document.getElementById('sopDetailModal').classList.add('hidden'); }

        function openSopKPIModal(st, title) {
            const upperSt = st.toUpperCase();
            const list = st ? filteredSopData.filter(i => {
                const itemStatus = i['Status Part'].toUpperCase();
                if (upperSt.includes('TUNGGU PASANG')) {
                    return itemStatus.includes('TUNGGU') || itemStatus.includes('PASANG');
                }
                return itemStatus.includes(upperSt);
            }) : filteredSopData;

            document.getElementById('sopKpiModalTitle').innerText = title;
            document.getElementById('sopKpiModalTableBody').innerHTML = list.map(i => {
                return `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="px-4 py-3 font-mono text-[10px] font-bold text-slate-700">${i['Code'] || '-'}</td>
                        <td class="px-4 py-3 font-bold text-slate-700">${i['Nama SA'] || '-'}</td>
                        <td class="px-4 py-3 font-bold text-indigo-600">${i['No Kendaraan'] || '-'}</td>
                        <td class="px-4 py-3"><span class="px-2 py-0.5 rounded text-[9px] font-bold border ${getSopStatusColor(i['Status Part'])}">${i['Status Part'] || '-'}</span></td>
                    </tr>`;
            }).join('');
            document.getElementById('sopKpiModal').classList.remove('hidden');
        }

        function closeSopKPIModal() { document.getElementById('sopKpiModal').classList.add('hidden'); }
    </script>
